services:
  - type: web
    name: sunsetdiff-site
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /api/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /api/*
        name: Content-Type
        value: application/json
      - path: /dataset/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  - type: web
    name: sunsetdiff-service
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:service
    startCommand: node service/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sunsetdiff-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"

databases:
  - name: sunsetdiff-db
    plan: free
    databaseName: sunsetdiff
    user: sunsetdiff
