name: refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Scrape official pages
        id: scrape
        run: npm run scrape
      - name: Test
        id: test
        run: npm test
      - name: Open or update scraper-broken issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-scraper-issue.mjs
      - name: Commit data if it changed
        if: success()
        run: |
          npx tsx scripts/generate-static.ts
          git config user.name sunsetdiff-bot
          git config user.email sunsetdiff-bot@users.noreply.github.com
          git add data snapshots action/snapshot
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi
