name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Probe DeepSeek pricing from this runner
        run: npx tsx scripts/probe-deepseek.ts
      - run: npm test
      - run: npm run build
