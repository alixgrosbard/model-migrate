name: close scraper issue
on:
  push:
    branches: [main]
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close the open scraper-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='The refresh passed after the scrapers were asked for HTML. OpenAI, Anthropic, and AWS had sent markdown, so the first run saw zero rows. Successful run: https://github.com/alixgrosbard/model-migrate/actions/runs/39126998559'
          issues=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&labels=scraper-broken")
          echo "$issues" | jq -c '.[] | {number,title}'
          echo "$issues" | jq -r '.[].number' | while read -r number; do
            [ -z "$number" ] && continue
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
              -d "$(jq -n --arg body "$notes" '{body:$body}')"
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${number}" \
              -d '{"state":"closed","state_reason":"completed"}'
            echo "Closed #$number"
          done
